<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="C3i">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3f48"/>
      <stop offset="100%" stop-color="#121416"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f22"/>
      <stop offset="100%" stop-color="#0a0b0c"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2e34"/>
      <stop offset="100%" stop-color="#0e1012"/>
    </linearGradient>
    <radialGradient id="void" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#5c6570" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#121416" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3EC" stop-opacity="0"/>
      <stop offset="35%" stop-color="#D89A4A" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#B5512C"/>
      <stop offset="100%" stop-color="#F7F3EC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- void / dark matter field -->
  <rect width="96" height="96" rx="18" fill="url(#void)"/>
  <!-- isometric cube sinking -->
  <g transform="translate(48 52)">
    <!-- top -->
    <path d="M0,-26 L28,-12 L0,2 L-28,-12 Z" fill="url(#faceTop)" stroke="#5C6570" stroke-width="0.6" opacity="0.95"/>
    <!-- left -->
    <path d="M-28,-12 L0,2 L0,30 L-28,16 Z" fill="url(#faceLeft)" stroke="#2a2e34" stroke-width="0.5"/>
    <!-- right -->
    <path d="M28,-12 L0,2 L0,30 L28,16 Z" fill="url(#faceRight)" stroke="#3a3f48" stroke-width="0.5"/>
    <!-- sink shadow into void -->
    <ellipse cx="0" cy="34" rx="26" ry="6" fill="#000" opacity="0.55" filter="url(#soft)"/>
  </g>
  <!-- comet-tail C sinking into cube -->
  <path d="M62 18 C48 10, 28 14, 24 30 C20 48, 34 58, 48 56" fill="none" stroke="url(#comet)" stroke-width="5.5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="48" cy="56" r="3.2" fill="#F7F3EC"/>
  <!-- small 3 -->
  <text x="58" y="64" font-family="Inter, IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#D89A4A">3</text>
</svg>
