<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C3i Engine | Operating Desk for Agencies</title>
  <meta name="description" content="Operating Desk for Agencies. Not FedRAMP-authorized. No invented customers." />
  <meta name="theme-color" content="#F7F3EC" />
</head>
<body style="background:#F7F3EC;font-family:system-ui,sans-serif;color:#121416;padding:2rem;">
  <p>Loading Operating Desk for Agencies...</p>
  <script>
  (async function () {
    var n = 18;
    var fetches = [];
    for (var i = 0; i < n; i++) {
      fetches.push(fetch("b64/p" + i + ".txt?v=20260921gov-clean3").then(function (r) {
        if (!r.ok) throw new Error("b64 fetch failed");
        return r.text();
      }));
    }
    var parts = await Promise.all(fetches);
    var bin = atob(parts.join("").replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    var html = new TextDecoder("utf-8").decode(bytes);
    document.open();
    document.write(html);
    document.close();
  })().catch(function (e) {
    document.body.innerHTML = "<p>Load failed. <a href=\"/engine/\">Business</a>. Not FedRAMP-authorized.</p><pre>" + e + "</pre>";
  });
  </script>
</body>
</html>
